<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIF Search App</title>
    <script>
      // GitHub Pages에서 SPA 라우팅을 위한 404.html
      // 현재 경로를 유지하면서 index.html로 리다이렉트
      var l = window.location;
      var redirect = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/perf-basecamp/';
      
      // 현재 경로가 /perf-basecamp/로 시작하는지 확인
      if (l.pathname.startsWith('/perf-basecamp/')) {
        // /perf-basecamp/를 제거하고 나머지 경로를 쿼리 파라미터로 전달
        var path = l.pathname.replace('/perf-basecamp', '');
        redirect += '?p=' + encodeURIComponent(path);
      }
      
      // 쿼리 파라미터와 해시 유지
      if (l.search) {
        redirect += (redirect.includes('?') ? '&' : '?') + l.search.slice(1);
      }
      if (l.hash) {
        redirect += l.hash;
      }
      
      l.replace(redirect);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
